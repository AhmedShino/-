name: build
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare
        run: |
          test -f index.html || { echo "index.html not found in repo root"; ls -la; exit 1; }
          mkdir -p www && cp index.html www/
          npm init -y
          npm i --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          npm i --legacy-peer-deps @capgo/capacitor-android-kiosk@6 || npm i --legacy-peer-deps @capgo/capacitor-android-kiosk || echo "kiosk plugin skipped"
          echo '{"appId":"com.mozakarty.app","appName":"Mozakarty","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
          python3 - <<'PY2'
          import re
          name=''.join('&#%d;'%ord(c) for c in '\u0645\u0630\u0627\u0643\u0631\u062a\u064a')
          f='android/app/src/main/res/values/strings.xml'
          t=open(f,encoding='utf-8').read()
          t=re.sub(r'(<string name="(?:app_name|title_activity_main)">)[^<]*(</string>)',lambda m:m.group(1)+name+m.group(2),t)
          open(f,'w',encoding='ascii').write(t)
          print(t)
          PY2
          python3 - <<'PY4'
          import re
          m='android/app/src/main/AndroidManifest.xml'
          t=open(m,encoding='utf-8').read()
          home='<category android:name="android.intent.category.LAUNCHER" /></intent-filter><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.HOME" /><category android:name="android.intent.category.DEFAULT" />'
          t,n=re.subn(r'<category android:name="android.intent.category.LAUNCHER"\s*/>',lambda x:home,t,count=1)
          print('home filter added:',n)
          open(m,'w',encoding='utf-8').write(t)
          h='android/app/src/main/assets/public/index.html'
          j=open(h,encoding='utf-8').read()
          j=j.replace("if(!KIOSK)return '<p><small>","if(!KIOSK)return '<p><small>[native='+NAT+'] ")
          j=j.replace("await KIOSK.setAsLauncher()}catch(e){}","await KIOSK.setAsLauncher()}catch(e){alert('launcher error: '+(e&&e.message||JSON.stringify(e)))}")
          j=j.replace("try{KIOSK.enterKioskMode()}catch(e){}","try{Promise.resolve(KIOSK.enterKioskMode()).catch(e=>alert('kiosk error: '+(e&&e.message||JSON.stringify(e))))}catch(e){}")
          open(h,'w',encoding='utf-8').write(j)
          PY4
          if [ -f icon.png ]; then
            mkdir -p assets
            pip install pillow -q
          python3 - <<'PY3'
          from PIL import Image, ImageFilter
          ic=Image.open('icon.png').convert('RGBA').resize((1024,1024),Image.LANCZOS)
          bg=ic.convert('RGB').crop((250,250,774,774)).resize((1024,1024),Image.LANCZOS).filter(ImageFilter.GaussianBlur(60)).convert('RGBA')
          bg.save('assets/icon-background.png')
          fg=Image.new('RGBA',(1024,1024),(0,0,0,0)); s=int(1024*.68)
          fg.paste(ic.resize((s,s),Image.LANCZOS),((1024-s)//2,(1024-s)//2))
          fg.save('assets/icon-foreground.png')
          only=bg.copy(); s2=int(1024*.94)
          only.alpha_composite(ic.resize((s2,s2),Image.LANCZOS),((1024-s2)//2,(1024-s2)//2))
          only.save('assets/icon-only.png')
          PY3
            npm i --legacy-peer-deps -D @capacitor/assets
            npx capacitor-assets generate --android || echo "icon generation skipped"
          fi
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PY'
          import wave,struct,math
          R={'ring_end':[1047,880,784,659,523,659,523],'ring_start':[523,659,784,1047,784,1047,1047]}
          sr=22050
          for n,notes in R.items():
              d=[]
              for rp in range(3):
                  for f in notes:
                      L=int(.38*sr)
                      for i in range(L):
                          e=min(1,i/300)*min(1,(L-i)/700)
                          d.append(int(30000*e*(math.sin(2*math.pi*f*i/sr)+.5*math.sin(4*math.pi*f*i/sr))/1.5))
                      d+=[0]*int(.04*sr)
              w=wave.open('android/app/src/main/res/raw/'+n+'.wav','wb')
              w.setnchannels(1);w.setsampwidth(2);w.setframerate(sr)
              w.writeframes(b''.join(struct.pack('<h',x) for x in d));w.close()
          PY
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.VIBRATE"/><application|' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          if ! ./gradlew assembleDebug --stacktrace; then
            echo "::warning::build failed with kiosk plugin, retrying without it"
            cd ..
            npm rm --legacy-peer-deps @capgo/capacitor-android-kiosk || true
            npx cap sync android
            cd android
            ./gradlew assembleDebug --stacktrace
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk

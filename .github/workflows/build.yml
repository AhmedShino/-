name: build
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare
        run: |
          test -f index.html || { echo "index.html not found in repo root"; ls -la; exit 1; }
          mkdir -p www && cp index.html www/
          # لو المشروع مقسّم لملفات (src و assets) انسخهم كمان
          if [ -d src ]; then cp -r src www/; fi
          if [ -d assets ]; then cp -r assets www/; fi
          # لو الملفات مرفوعة في الصفحة الرئيسية من غير مجلدات
          if ls ./*.js >/dev/null 2>&1; then cp ./*.js www/; fi
          if [ -f main.css ]; then cp main.css www/; fi
          if grep -q 'core.js' index.html && [ ! -f www/core.js ] && [ ! -f www/src/core.js ]; then echo "core.js missing from repo"; exit 1; fi
          npm init -y
          npm i --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          echo '{"appId":"com.mozakarty.app","appName":"Mozakarty","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
          python3 - <<'PY2'
          import re
          name=''.join('&#%d;'%ord(c) for c in '\u0645\u0630\u0627\u0643\u0631\u062a\u064a')
          f='android/app/src/main/res/values/strings.xml'
          t=open(f,encoding='utf-8').read()
          t=re.sub(r'(<string name="(?:app_name|title_activity_main)">)[^<]*(</string>)',lambda m:m.group(1)+name+m.group(2),t)
          open(f,'w',encoding='ascii').write(t)
          print(t)
          PY2
          if [ -f icon.png ]; then
            mkdir -p assets
            pip install pillow -q
          pip install numpy -q
          python3 - <<'PY3'
          from PIL import Image, ImageFilter, ImageDraw
          import numpy as np
          ic=Image.open('icon.png').convert('RGBA').resize((1024,1024),Image.LANCZOS)
          def make(scale):
              s=int(1024*scale); off=(1024-s)//2
              small=ic.resize((s,s),Image.LANCZOS)
              canvas=Image.new('RGBA',(1024,1024),(0,0,0,0)); canvas.paste(small,(off,off))
              a=np.array(canvas)
              yy,xx=np.mgrid[0:1024,0:1024]
              dx=xx-511.5; dy=yy-511.5; r=np.hypot(dx,dy)
              R=s/2*0.96
              k=np.minimum(1,R/np.maximum(r,1e-6))
              sx=(511.5+dx*k).round().astype(int).clip(0,1023)
              sy=(511.5+dy*k).round().astype(int).clip(0,1023)
              smear=Image.fromarray(a[sy,sx][:,:,:3].astype('uint8')).convert('RGBA').filter(ImageFilter.GaussianBlur(30))
              full=smear.copy(); full.alpha_composite(canvas)
              return full,canvas
          full,fg=make(.72)
          full.save('assets/icon-background.png')
          fg.save('assets/icon-foreground.png')
          only,_=make(.94)
          only.save('assets/icon-only.png')
          PY3
            npm i --legacy-peer-deps -D @capacitor/assets
            npx capacitor-assets generate --android || echo "icon generation skipped"
          fi
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PY'
          import wave,struct,math
          R={'ring_end':[1047,880,784,659,523,659,523],'ring_start':[523,659,784,1047,784,1047,1047]}
          sr=22050
          for n,notes in R.items():
              d=[]
              for rp in range(3):
                  for f in notes:
                      L=int(.38*sr)
                      for i in range(L):
                          e=min(1,i/300)*min(1,(L-i)/700)
                          d.append(int(30000*e*(math.sin(2*math.pi*f*i/sr)+.5*math.sin(4*math.pi*f*i/sr))/1.5))
                      d+=[0]*int(.04*sr)
              w=wave.open('android/app/src/main/res/raw/'+n+'.wav','wb')
              w.setnchannels(1);w.setsampwidth(2);w.setframerate(sr)
              w.writeframes(b''.join(struct.pack('<h',x) for x in d));w.close()
          PY
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.VIBRATE"/><application|' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk

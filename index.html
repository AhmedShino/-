<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مذاكرتي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf3e6;--cd:#fffdf9;--tx:#241f1a;--mu:#8a7c68;--pr:#e2870f;--pr2:#ffb648;--pt:#241f1a;--am:#c2410c;--ok:#2f8f3e;--bad:#d43d3d;--bd:#ecdfc4;--shd:rgba(226,135,15,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171310;--cd:#231d17;--tx:#f5ecdc;--mu:#b3a48c;--pr:#ffb648;--pr2:#ffd08a;--pt:#221806;--am:#ffb648;--ok:#4ade80;--bad:#f4726f;--bd:#392e22;--shd:rgba(255,182,72,.12)}}
:root[data-theme="dark"]{--bg:#171310;--cd:#231d17;--tx:#f5ecdc;--mu:#b3a48c;--pr:#ffb648;--pr2:#ffd08a;--pt:#221806;--am:#ffb648;--ok:#4ade80;--bad:#f4726f;--bd:#392e22;--shd:rgba(255,182,72,.12)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;padding:14px 14px 84px;max-width:560px;margin-inline:auto}
h1{font-size:24px;font-weight:900;margin:0}h2{font-size:17px;margin:0 0 10px;font-weight:700}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px var(--shd)}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
textarea{min-height:60px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:9px 14px}
button.pr{background:var(--pr);color:var(--pt);border-color:var(--pr);font-weight:700;width:100%}
button.ok{color:var(--ok)}button.bad{color:var(--bad)}
.ch.on{background:var(--pr);color:var(--pt)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.r{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.r>div{flex:1}.r small{display:block;color:var(--mu)}
.r input[type=checkbox]{width:22px;height:22px;margin:0}
.dn b{text-decoration:line-through;color:var(--mu)}
.x{border:0;background:none;color:var(--mu);padding:4px 8px}
.warn{border-color:var(--am)}
.warn b{color:var(--am)}
.big{font-size:64px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.big2{font-size:26px;letter-spacing:2px;margin:8px 0}
small{color:var(--mu)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.g big{display:block;font-size:30px;font-weight:900}
.bars{display:flex;align-items:flex-end;gap:6px;height:100px;margin-top:8px}
.bars i{flex:1;background:var(--pr);border-radius:5px 5px 0 0;min-height:3px}
.bars2{display:flex;gap:6px;text-align:center}.bars2 span{flex:1;font-size:12px;color:var(--mu)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--pr)}
details{margin:6px 0}p{margin:6px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;padding:12px 0 10px;color:var(--mu);font-size:12px}
nav button.on{color:var(--pr);font-weight:700}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding-top:6px;margin-bottom:10px}
.mark{background:linear-gradient(transparent 62%,var(--pr2) 62%);padding:0 2px}
.hd{display:flex;align-items:center;gap:10px}
.lvl{width:38px;height:38px;border-radius:11px;background:linear-gradient(160deg,var(--pr),var(--pr2));color:var(--pt);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex-shrink:0}
.xpwrap{flex:1;min-width:0}
.xpbar{height:7px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--pr2))}
.flame{font-weight:900;color:var(--am);white-space:nowrap;font-size:13px}
.qbtn{border:0;background:none;color:var(--mu);padding:6px;font-size:18px;line-height:1}
.lb{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.lb b.rk{width:22px;text-align:center;color:var(--mu);font-weight:900;flex-shrink:0}
.lb.me{background:var(--shd);margin:0 -14px;padding-inline:14px;border-radius:10px}
.code{font-family:monospace;font-size:22px;letter-spacing:4px;font-weight:900;text-align:center;background:var(--bg);border:1px dashed var(--bd);border-radius:10px;padding:10px}
.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:9;pointer-events:none}
</style></head><body>
<header><div class="hd" style="justify-content:space-between"><b style="font-size:16px"><span class="mark">مذاكرتي</span> 📚</b><div><button class="qbtn" id="thb" onclick="toggleTheme()">🌓</button><button class="qbtn" onclick="stopTest();tab='help';render()">؟</button></div></div></header>
<div id="v"></div>
<nav><button data-t="today">النهاردة</button><button data-t="mat">موادي</button><button data-t="mist">الحفظ</button><button data-t="stats">إحصائياتي</button></nav>
<script>
const K='mozakarty';
function normState(x){
  if(!x||typeof x!=='object') x={};
  ['tasks','mist','sess','cards','lec','dk'].forEach(k=>{if(!Array.isArray(x[k]))x[k]=[]});
  ['slog','tch','sb'].forEach(k=>{if(!x[k]||typeof x[k]!=='object'||Array.isArray(x[k]))x[k]={}});
  if(!x.sl||typeof x.sl!=='object')x.sl={h:8,w:Array(7).fill('06:30')};
  if(!Array.isArray(x.sl.w)||x.sl.w.length!==7)x.sl.w=Array(7).fill('06:30');
  x.sl.h=Math.max(1,Math.min(24,+x.sl.h||8));
  x.sess=x.sess.map(v=>({d:v&&v.d||'',min:Math.max(0,+((v&&v.min)||0)),s:v&&v.s||''}));
  delete x.xp;
  return x;
}
let S=null;
try{S=normState(JSON.parse(localStorage.getItem(K)))}catch(e){}
S=S||{tasks:[],mist:[],sess:[],cap:120};
if(!S.bu){if(S.bm)S.bm*=60;S.bu=1}S.cards=S.cards||[];S.dk=S.dk||[];if(S.cards.length){S.dk.push({id:Date.now(),n:'بطاقاتي القديمة',cards:S.cards});S.cards=[]}S.lec=S.lec||[];S.tch=S.tch||{};S.expl=S.expl||[];S.slog=S.slog||{};S.sl=S.sl||{h:8,w:Array(7).fill('06:30')};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}cloudPush()};
const $=i=>document.getElementById(i);
const day=(d=new Date())=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const add=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return day(d)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':');
const T=day();let tab='today',dur=1500,run=null,iv=null;
const mins=d=>S.sess.filter(x=>x.d==d).reduce((a,x)=>a+x.min,0);
const curStreak=()=>{let st=0,d=mins(T)?T:add(T,-1);while(mins(d)){st++;d=add(d,-1)}return st};
const weekMin=()=>[...Array(7)].reduce((a,_,i)=>a+mins(add(T,-i)),0);
function paintHeader(){const tb=$('thb');if(tb)tb.textContent=S.theme==='dark'?'☀️':(S.theme==='light'?'🌙':'🌓')}
function applyTheme(){if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);else document.documentElement.removeAttribute('data-theme')}
function toggleTheme(){const dk=matchMedia('(prefers-color-scheme: dark)').matches,cur=S.theme||(dk?'dark':'light');S.theme=cur==='dark'?'light':'dark';save();applyTheme();paintHeader()}
const bk='';

const row=t=>`<div class="r ${t.done?'dn':''}"><input type="checkbox" ${t.done?'checked':''} onchange="tg(${t.id})"><div><b>${t.df==3?'🔥 ':''}${esc(t.n)}</b><small>${esc(t.s||'')}${t.min?' • '+t.min+' د':''}${t.date!=T?' • '+t.date:''}</small></div><button class="x" onclick="dl(${t.id})">✕</button></div>`;

let stid='',fmsg='',wz=0;
const rw=t=>`<div class="r ${t.done?'dn':''}"><input type="checkbox" ${t.done?'checked':''} onchange="tg(${t.id})"><div><b>${esc(t.n)}</b><small>${esc(t.s||'')}${t.date!=T?' • '+t.date:''}</small></div>${!t.done&&!run?`<button onclick="stid=${t.id};go()">▶</button>`:''}<button class="x" onclick="dl(${t.id})">✕</button></div>`;
function vToday(){
 const LT=lecDue(),td=S.tasks.filter(t=>t.date==T).sort((a,b)=>(a.done-b.done)),todo=td.filter(t=>!t.done),od=S.tasks.filter(t=>!t.done&&t.date<T).length,up=S.tasks.filter(t=>!t.done&&t.date>T).sort((a,b)=>a.date.localeCompare(b.date)),tw=new Date().getDay();
 const rC=565.48,rLeft=run?Math.max(0,(run.p?run.left:run.end-Date.now())/1e3):0,rFrac=run?Math.min(1,Math.max(0,1-rLeft/run.tot)):0,rOff=rC*rFrac;
 const tm=run?`<div class="c" style="text-align:center"><div style="position:relative;width:200px;height:200px;margin:0 auto"><svg width="200" height="200" viewBox="0 0 200 200" style="transform:rotate(-90deg)"><circle cx="100" cy="100" r="90" fill="none" stroke="var(--bd)" stroke-width="12"/><circle id="pr" cx="100" cy="100" r="90" fill="none" stroke="var(--pr)" stroke-width="12" stroke-linecap="round" stroke-dasharray="565.48" stroke-dashoffset="${rOff}" style="transition:stroke-dashoffset .3s linear"/></svg><div class="big" id="tm" style="font-size:40px;position:absolute;inset:0;display:flex;align-items:center;justify-content:center">${fmt(Math.max(0,Math.ceil(rLeft)))}</div></div><p id="fm" style="text-align:center"><small>${run.p?'متوقف مؤقتاً ⏸':run.brk?'استرح شوية ☕':'ركز في جلستك 📚'}</small></p>${run.brk&&fmsg?`<div style="text-align:center">${fmsg}</div>`:''}<div class="row"><button class="pr" style="flex:1" onclick="pz()">${run.p?'▶ إكمال':'⏸ إيقاف مؤقت'}</button><button class="pr" style="flex:1" onclick="dn2()">✅ انتهيت</button></div></div>`:fmsg?`<div class="c"><p id="fm" style="text-align:center">${fmsg}</p><button style="width:100%" onclick="cm()">إغلاق</button></div>`:'';
 return tm+(run?'':`<div class="c" style="text-align:center"><h2>مطلوب منك النهاردة</h2><div class="big">${todo.length}</div><small>درس${LT.length?' + '+LT.length+' محاضرة':''}</small>${todo.length||LT.length?'<button class="pr" style="margin-top:10px" onclick="sb()">ابدأ ▶</button>':'<p>🎉 خلّصت كل دروس النهاردة</p>'}${durUI()}</div>`)
 +(LT.length?vLecToday(LT):'')+(od?`<div class="c warn"><b>⚠️ عندك ${od} درس متأخر</b><div class="row"><button onclick="tab='mat';render()">افتح موادي</button></div></div>`:'')
 +`<div class="c"><h2>دروس النهاردة</h2>${td.map(rw).join('')||'<p><small>مفيش دروس النهاردة.</small></p>'}</div>`
 +(up.length?`<details class="c"><summary><b>الجاي (${up.length})</b></summary>${up.map(rw).join('')}</details>`:'')
 +`<details class="c"><summary><b>➕ ضيف درس</b></summary><input id="n" placeholder="اسم الدرس"><input id="s" placeholder="المادة"><input id="dt" type="date" value="${T}"><button class="pr" onclick="at()">ضيف</button></details>`
 +`<div class="c"><small>🌙 نام الليلة الساعة</small> <b>${t12(bt(S.sl.w[tw],S.sl.h))}</b></div>`}
function sb(){const t=S.tasks.filter(x=>x.date==T&&!x.done)[0];stid=t?t.id:'';go()}
function cm(){stopAlarm();fmsg='';render()}
function vWiz(){
 const n=bkl().length;let t,b;
 if(wz==0){t=vImp()+(n?`<p>اتضاف ${n} درس متأخر ✓</p>`:'')+`<button class="pr" onclick="wz=${n?1:2};render()">${n?'التالي':'معنديش تراكمات، كمّل'}</button>`}
 else if(wz==1)t=`<div class="c"><h2>عايز تخلّصهم في كام يوم؟</h2><p>عندك ${n} درس متأخر.</p><input id="pn" type="number" min="1" max="30" value="7"><button class="pr" onclick="w1()">التالي</button></div>`;
 else t='<div class="c"><h2>بتصحى الساعة كام؟</h2><input id="wk" type="time" value="06:30"><button class="pr" onclick="w2()">خلّصت، يلا نبدأ</button></div>';
 return `<div class="c"><h2>أهلاً بيك 👋</h2><small>خطوة ${wz+1} من 3</small></div>${t}<button style="width:100%" onclick="hs()">تخطّي</button>`}
function w1(){mp();cf();wz=2;render()}
function w2(){const v=$('wk').value||'06:30';S.sl.w=Array(7).fill(v);hs()}
function hs(){S.seen=1;save();tab='today';render()}
function vStats(){
 const wk=[...Array(7)].map((_,i)=>{const d=add(T,i-6);return[d,mins(d)]}),mx=Math.max(...wk.map(w=>w[1]),1);
 const st=curStreak(),by={};S.sess.forEach(x=>{const k=x.s||'مذاكرة حرة';by[k]=(by[k]||0)+x.min});
 return `${wr()}<div class="c g"><div><big>${mins(T)}</big><small>دقيقة النهاردة</small></div><div><big style="color:var(--am)">🔥${st}</big><small>أيام متواصلة</small></div></div>
 <div class="c"><b>آخر 7 أيام (بالدقايق)</b><div class="bars">${wk.map(w=>`<i style="height:${w[1]/mx*100}%"></i>`).join('')}</div><div class="bars2">${wk.map(w=>`<span>${w[1]}</span>`).join('')}</div></div>
 <div class="c"><b>حسب المادة</b>${Object.entries(by).map(([k,v])=>`<div class="r"><div>${esc(k)}</div><span>${v} د</span></div>`).join('')||'<p><small>ابدأ جلسة مذاكرة وهتظهر بياناتك هنا.</small></p>'}</div>`}

document.addEventListener('visibilitychange',()=>{if(document.hidden)stopTest()});
function render(){snap();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 $('v').innerHTML=({today:vToday,mat:vMat,plan:vPlan,mist:vMem,stats:()=>vStats()+'<details class="c"><summary><b>🌙 جدول النوم</b></summary>'+vSleep()+'</details><details class="c"><summary><b>🔔 نغمة التنبيه</b></summary>'+vRing()+'</details><details class="c"><summary><b>🔒 وضع المذاكرة الصارم</b></summary>'+vStrict()+'</details><details class="c"><summary><b>☁️ المزامنة والنسخ الاحتياطي</b></summary>'+vSync()+'</details>',help:vHelp,wiz:vWiz})[tab]();
 paintHeader();
}
document.querySelector('nav').onclick=e=>{const t=e.target.dataset.t;if(t){stopTest();tab=t;render()}};

function at(){const n=$('n').value.trim();if(!n)return;const me=$('m'),de=$('df');S.tasks.push({id:Date.now(),n,s:$('s').value.trim(),min:me?+me.value||30:30,date:$('dt').value||T,df:de?+de.value:0,done:false});save();render()}
function tg(id){const t=S.tasks.find(x=>x.id==id);t.done=!t.done;save();render()}
function dl(id){S.tasks=S.tasks.filter(x=>x.id!=id);save();render()}
function go(){if(run)return;stopAlarm();fmsg='';try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}
 run={end:Date.now()+dur*1e3,tot:dur,tid:stid};startAud(dur,0);iv=setInterval(tick,500);render();lockStrict()}
function tick(){if(!run)return;const l=Math.ceil((run.end-Date.now())/1e3);if(l<=0){fin();return}const e=$('tm');if(e)e.textContent=fmt(l);const p=$('pr');if(p)p.style.strokeDashoffset=565.48*Math.min(1,Math.max(0,1-Math.max(0,(run.end-Date.now())/1e3)/run.tot))}
function fin(){clearInterval(iv);stopAud();if(run.brk){run=null;fmsg='⏰ الراحة خلصت. جاهز تبدأ جلسة تانية؟'+nxt();render();startAlarm('s');return}
 unlockStrict();const sv=recS(run.tot);run=null;
 fmsg=(sv?'⏰ خلصت الجلسة.':'⏰ خلصت. الجلسة قصيرة أوي ومتسجلتش في إحصائياتك، جرب مدة أطول.')+' جاهز للراحة؟ '+bkb();render();startAlarm('b')}
function recS(el){const t=S.tasks.find(x=>x.id==run.tid);if(el<30)return 0;S.sess.push({d:T,min:Math.max(1,Math.round(el/60)),s:t?t.s:''});if(S.sess.length>500)S.sess=S.sess.slice(-500);return 1}

function se(v){S.exam=v;save();render()}
function sg(v){S.goal=+v||120;save();render()}
function brk(sec){stopAlarm();sec=sec||300;fmsg='';run={end:Date.now()+sec*1e3,tot:sec,brk:1};startAud(0,sec);iv=setInterval(tick,500);render()}
let sub='cards',fcs=0;
const ORD=[6,0,1,2,3,4,5],NM=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const bt=(w,h)=>{const[a,b]=w.split(':').map(Number);const m=((a*60+b-Math.round(h*60)-15)%1440+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const t12=q=>{const[a,b]=q.split(':').map(Number);return (a%12||12)+':'+String(b).padStart(2,'0')+(a<12?' ص':' م')};
function vMem(){return `<div class="row">${[['cards','ملفات الحفظ'],['exam','امتحان']].map(([k,n])=>`<button class="ch ${sub==k?'on':''}" onclick="sub='${k}';render()">${n}</button>`).join('')}</div>`+({cards:vCards,exam:vExam})[sub]()}
let dk=0,Q=null,darm=0,led=0,ted=0;
const D=()=>S.dk.find(d=>d.id==dk),shf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function vCards(){
 if(Q)return vQuiz();
 const d=D();
 if(!d)return `<div class="c"><h2>ملفات الحفظ</h2>${S.dk.map(x=>`<div class="r"><div><b>${esc(x.n)}</b><small>${x.cards.length} بطاقة • ${x.cards.filter(c=>c.nx<=T).length} للمراجعة</small></div><button onclick="dk=${x.id};fcs=0;render()">افتح</button></div>`).join('')||'<p><small>لسه مفيش ملفات. اعمل أول ملف.</small></p>'}</div><div class="c"><b>➕ ملف جديد</b><input id="dn" placeholder="اسم الملف (مثلاً: قوانين الفيزياء)"><button class="pr" onclick="nd()">اعمل الملف</button></div>`;
 const due=d.cards.filter(c=>c.nx<=T),c=due[0];
 return `<button style="margin-bottom:10px" onclick="dk=0;render()">← كل الملفات</button><div class="c"><h2>${esc(d.n)}</h2><small>${d.cards.length} بطاقة • ${due.length} للمراجعة النهاردة</small>${c?`<div class="big2" style="text-align:center;font-size:22px">${esc(c.f)}</div>${fcs?`<div class="c" style="background:var(--bg)">${esc(c.b)}</div><div class="row"><button class="ok" onclick="rc(${c.id},1)">عرفتها ✓</button><button class="bad" onclick="rc(${c.id},0)">لسه ✗</button></div>`:'<button class="pr" onclick="fcs=1;render()">اكشف الإجابة</button>'}`:'<p><small>مفيش بطاقات للمراجعة النهاردة 👌</small></p>'}</div>
 <div class="c"><b>➕ بطاقة جديدة</b><textarea id="cf" placeholder="الوش: سؤال أو مصطلح أو قانون"></textarea><textarea id="cb" placeholder="الضهر: الإجابة"></textarea><button class="pr" onclick="ac()">احفظ البطاقة</button></div>

const bkb=()=>`<button class="pr" onclick="brk(S.bm||300)">ابدأ الراحة ☕ (${fd(S.bm||300)})</button>`;
function wav(secs,chs,sr){const n=Math.round(secs*sr),b=new Uint8Array(44+n),dv=new DataView(b.buffer),w=(o,t)=>{for(let i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i)};
 w(0,'RIFF');dv.setUint32(4,36+n,true);w(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);w(36,'data');dv.setUint32(40,n,true);
 b.fill(128,44);for(let i=44;i<b.length;i+=2)b[i]=129;const k=sr>=2400?1:.6;
 chs.forEach(c=>{const p=presetOf(c.k),arr=p[c.k],rep=arr.length*p.gap+p.dur+.3;for(let rp=0;rp<3;rp++)arr.forEach((f0,j)=>{const f=f0*k,s0=Math.round((c.at+rp*rep+j*p.gap)*sr),len=Math.round(p.dur*sr);for(let i=0;i<len&&s0+i<n;i++){const t=i/sr,v=wsamp(p.type,f*t);b[44+s0+i]=128+Math.round(v*127*Math.min(1,i/60)*Math.min(1,(len-i)/150))}})});
 return new Blob([b],{type:'audio/wav'})}
function startAud(sess,b){stopAud();if(NAT){nSched(sess>0?sess:b,sess>0?'ends2':'starts2',sess>0?'⏰ خلصت المذاكرة':'⏰ الراحة خلصت',sess>0?'وقت الراحة. افتح التطبيق':'يلا نبدأ مذاكرة');return}try{const ch=[],sr=(sess+b)>3600?1600:2400;if(sess>0)ch.push({at:sess,k:'e'});if(b>0)ch.push({at:sess+b,k:'s'});
 AUD=new Audio(URL.createObjectURL(wav(sess+b+11,ch,sr)));AUD.volume=1;AUD.onended=()=>stopAud();AUD.play().catch(()=>{});
 if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:sess>0?'جلسة تركيز':'راحة',artist:'مذاكرتي'});
 navigator.wakeLock&&navigator.wakeLock.request('screen').then(x=>WL=x).catch(()=>{})}catch(e){}}
function stopAud(){nCancel();try{if(AUD){AUD.pause();AUD=null}if(WL){WL.release();WL=null}}catch(e){}}
function scd(d,v){S.cd=S.cd||Array(7).fill(S.cp||3);S.cd[d]=Math.max(0,+v||0);save()}
function capOf(d){let c=S.cd||Array(7).fill(S.cp||3);if(!c.some(x=>x>0))c=Array(7).fill(3);return c[new Date(add(T,d)+'T12:00').getDay()]}
const capAvg=()=>(S.cd||Array(7).fill(S.cp||3)).reduce((a,b)=>a+b,0)/7;
function applyPlan(){if(!S.po)return;const L=planItems();let d=0,ld=0,ch=0;
 L.forEach(o=>{if(o.rel>d){d=o.rel;ld=0}while(ld>=capOf(d)){d++;ld=0}o.day=d;ld++;if(!o.v){const nd=add(T,d);if('date' in o.x){if(o.x.date!==nd){o.x.date=nd;ch=1}}else if(o.x.d!==nd){o.x.d=nd;ch=1}}});
 if(ch)save();return L}
function pto(i,d){if(isNaN(d))return;const L=applyPlan(),k=S.po[i],a=S.po.filter((_,x)=>x!=i),j=L.findIndex((o,x)=>x!=i&&o.day>=d);a.splice(j<0?a.length:(j>i?j-1:j),0,k);S.po=a;mvi=-1;applyPlan();save();render()}

 try{const o=JSON.parse($('bkp').value);if(!o||typeof o!=='object'||!Array.isArray(o.tasks))throw 0;S=normState(o);barm=0;save();render()}catch(e){$('bkm').textContent='النص مش سليم'}}
let CDB=null,CUID=null,cloudOn=false,cloudPending=true,cloudTimer=null,stUnsub=null;
function cloudPush(){if(!cloudOn||!CDB||!CUID)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>{S.updatedAt=Date.now();CDB.doc('data/users/'+CUID+'/state').set(S).catch(()=>{})},1200)}
async function cloudInit(){
 try{
  if(!window.claude||!claude.use){cloudPending=false;return}
  const user=await claude.use('user'),db=await claude.use('db');
  if(!user||!db){cloudPending=false;return}
  const uid=await user.id();
  if(!uid){cloudPending=false;return}
  CDB=db;CUID=uid;
  const ref=db.doc('data/users/'+uid+'/state'),snap=await ref.get();
  if(snap.exists){const r=snap.data();
   if(r&&(!S.updatedAt||(r.updatedAt&&r.updatedAt>S.updatedAt))){S=normState(r);try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
  }else ref.set(Object.assign({},S,{updatedAt:Date.now()})).catch(()=>{});
  cloudOn=true;
  stUnsub=ref.onSnapshot(sn=>{
   if(!sn.exists||sn.metadata.hasPendingWrites)return;const r=sn.data();
   if(r&&r.updatedAt&&r.updatedAt>(S.updatedAt||0)){S=normState(r);if(S.seen&&tab=='wiz')tab='today';try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render()}
  },e=>{if(e.code=='revoked')cloudOn=false});
  cloudPending=false;if(S.seen&&tab=='wiz')tab='today';render()
 }catch(e){cloudPending=false;render()}
}

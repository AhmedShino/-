<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مذاكرتي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5ee;--cd:#fff;--tx:#12261f;--mu:#62706a;--pr:#0f766e;--pt:#fff;--am:#d97706;--ok:#15803d;--bad:#b91c1c;--bd:#dfe6dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1815;--cd:#16241f;--tx:#e8f1ec;--mu:#8fa39a;--pr:#2dd4bf;--pt:#06201c;--am:#fbbf24;--ok:#4ade80;--bad:#f87171;--bd:#24372f}}
:root[data-theme="dark"]{--bg:#0e1815;--cd:#16241f;--tx:#e8f1ec;--mu:#8fa39a;--pr:#2dd4bf;--pt:#06201c;--am:#fbbf24;--ok:#4ade80;--bad:#f87171;--bd:#24372f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;padding:14px 14px 84px;max-width:560px;margin-inline:auto}
h1{font-size:26px;font-weight:900;margin:4px 0 12px}h2{font-size:18px;margin:0 0 10px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
textarea{min-height:60px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:9px 14px}
button.pr{background:var(--pr);color:var(--pt);border-color:var(--pr);font-weight:700;width:100%}
button.ok{color:var(--ok)}button.bad{color:var(--bad)}
.ch.on{background:var(--pr);color:var(--pt)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.r{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.r>div{flex:1}.r small{display:block;color:var(--mu)}
.r input[type=checkbox]{width:22px;height:22px;margin:0}
.dn b{text-decoration:line-through;color:var(--mu)}
.x{border:0;background:none;color:var(--mu);padding:4px 8px}
.warn{border-color:var(--am)}
.warn b{color:var(--am)}
.big{font-size:64px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.big2{font-size:26px;letter-spacing:2px;margin:8px 0}
small{color:var(--mu)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.g big{display:block;font-size:30px;font-weight:900}
.bars{display:flex;align-items:flex-end;gap:6px;height:100px;margin-top:8px}
.bars i{flex:1;background:var(--pr);border-radius:5px 5px 0 0;min-height:3px}
.bars2{display:flex;gap:6px;text-align:center}.bars2 span{flex:1;font-size:12px;color:var(--mu)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--pr)}
details{margin:6px 0}p{margin:6px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:12px 0;color:var(--mu);font-size:13px}
nav button.on{color:var(--pr);font-weight:700}
</style></head><body>
<div class="row" style="justify-content:space-between;align-items:center"><h1 style="margin:4px 0">مذاكرتي 📚</h1><button onclick="tab='help';render()">؟ طريقة الاستخدام</button></div><div id="v"></div>
<nav><button data-t="today">النهاردة</button><button data-t="mat">موادي</button><button data-t="mist">الحفظ</button><button data-t="stats">إحصائياتي</button></nav>
<script>
const K='mozakarty';let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{tasks:[],mist:[],sess:[],cap:120};
if(!S.bu){if(S.bm)S.bm*=60;S.bu=1}S.cards=S.cards||[];S.dk=S.dk||[];if(S.cards.length){S.dk.push({id:Date.now(),n:'بطاقاتي القديمة',cards:S.cards});S.cards=[]}S.lec=S.lec||[];S.tch=S.tch||{};S.expl=S.expl||[];S.slog=S.slog||{};S.sl=S.sl||{h:8,w:Array(7).fill('06:30')};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i);
const day=(d=new Date())=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const add=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return day(d)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':');
const T=day();let tab='today',dur=1500,run=null,iv=null;
const mins=d=>S.sess.filter(x=>x.d==d).reduce((a,x)=>a+x.min,0);
const bk='';

const row=t=>`<div class="r ${t.done?'dn':''}"><input type="checkbox" ${t.done?'checked':''} onchange="tg(${t.id})"><div><b>${t.df==3?'🔥 ':''}${esc(t.n)}</b><small>${esc(t.s||'')}${t.min?' • '+t.min+' د':''}${t.date!=T?' • '+t.date:''}</small></div><button class="x" onclick="dl(${t.id})">✕</button></div>`;

let stid='',fmsg='',wz=0;
const rw=t=>`<div class="r ${t.done?'dn':''}"><input type="checkbox" ${t.done?'checked':''} onchange="tg(${t.id})"><div><b>${esc(t.n)}</b><small>${esc(t.s||'')}${t.date!=T?' • '+t.date:''}</small></div>${!t.done&&!run?`<button onclick="stid=${t.id};go()">▶</button>`:''}<button class="x" onclick="dl(${t.id})">✕</button></div>`;
function vToday(){
 const LT=lecDue(),td=S.tasks.filter(t=>t.date==T).sort((a,b)=>(a.done-b.done)),todo=td.filter(t=>!t.done),od=S.tasks.filter(t=>!t.done&&t.date<T).length,up=S.tasks.filter(t=>!t.done&&t.date>T).sort((a,b)=>a.date.localeCompare(b.date)),tw=(new Date().getDay()+1)%7;
 const last=S.sess.slice(-12).map(x=>x.clean?'🌳':'🥀').join('');
 const tm=run?`<div class="c"><div class="big" id="tm" style="font-size:54px">${fmt(Math.max(0,Math.ceil((run.p?run.left:run.end-Date.now())/1e3)))}</div><p id="fm" style="text-align:center"><small>${run.p?'متوقف مؤقتاً ⏸':run.brk?'استرح شوية ☕':'ركّز. لو خرجت من الصفحة هتتحسب محاولة تشتت.'}</small></p>${run.brk&&fmsg?`<div style="text-align:center">${fmsg}</div>`:''}<div class="row"><button class="pr" style="flex:1" onclick="pz()">${run.p?'▶ إكمال':'⏸ إيقاف مؤقت'}</button><button class="pr" style="flex:1" onclick="dn2()">✅ انتهيت</button></div></div>`:fmsg?`<div class="c"><p id="fm" style="text-align:center">${fmsg}</p><button style="width:100%" onclick="cm()">إغلاق</button></div>`:'';
 return tm+(run?'':`<div class="c" style="text-align:center"><h2>مطلوب منك النهاردة</h2><div class="big">${todo.length}</div><small>درس${LT.length?' + '+LT.length+' محاضرة':''}</small>${todo.length||LT.length?'<button class="pr" style="margin-top:10px" onclick="sb()">ابدأ ▶</button>':'<p>🎉 خلّصت كل دروس النهاردة</p>'}${durUI()}</div>`)
 +(LT.length?vLecToday(LT):'')+(od?`<div class="c warn"><b>⚠️ عندك ${od} درس متأخر</b><div class="row"><button onclick="tab='mat';render()">افتح موادي</button></div></div>`:'')
 +`<div class="c"><h2>دروس النهاردة</h2>${td.map(rw).join('')||'<p><small>مفيش دروس النهاردة.</small></p>'}</div>`
 +(up.length?`<details class="c"><summary><b>الجاي (${up.length})</b></summary>${up.map(rw).join('')}</details>`:'')
 +`<details class="c"><summary><b>➕ ضيف درس</b></summary><input id="n" placeholder="اسم الدرس"><input id="s" placeholder="المادة"><input id="dt" type="date" value="${T}"><button class="pr" onclick="at()">ضيف</button></details>`
 +`<div class="c"><small>🌙 نام الليلة الساعة</small> <b>${t12(bt(S.sl.w[tw],S.sl.h))}</b></div>`
 +(last?`<div class="c"><b>شجرتك</b><div class="big2">${last}</div></div>`:'')}
function sb(){const t=S.tasks.filter(x=>x.date==T&&!x.done)[0];stid=t?t.id:'';go()}
function cm(){fmsg='';render()}
function vWiz(){
 const n=bkl().length;let t,b;
 if(wz==0){t=vImp()+(n?`<p>اتضاف ${n} درس متأخر ✓</p>`:'')+`<button class="pr" onclick="wz=${n?1:2};render()">${n?'التالي':'معنديش تراكمات، كمّل'}</button>`}
 else if(wz==1)t=`<div class="c"><h2>عايز تخلّصهم في كام يوم؟</h2><p>عندك ${n} درس متأخر.</p><input id="pn" type="number" min="1" max="30" value="7"><button class="pr" onclick="w1()">التالي</button></div>`;
 else t='<div class="c"><h2>بتصحى الساعة كام؟</h2><input id="wk" type="time" value="06:30"><button class="pr" onclick="w2()">خلّصت، يلا نبدأ</button></div>';
 return `<div class="c"><h2>أهلاً بيك 👋</h2><small>خطوة ${wz+1} من 3</small></div>${t}<button style="width:100%" onclick="hs()">تخطّي</button>`}
function w1(){mp();cf();wz=2;render()}
function w2(){const v=$('wk').value||'06:30';S.sl.w=Array(7).fill(v);hs()}
function hs(){S.seen=1;save();tab='today';render()}
function vStats(){
 const mins=d=>S.sess.filter(x=>x.d==d).reduce((a,x)=>a+x.min,0);
 const wk=[...Array(7)].map((_,i)=>{const d=add(T,i-6);return[d,mins(d)]}),mx=Math.max(...wk.map(w=>w[1]),1);
 let st=0,d=mins(T)?T:add(T,-1);while(mins(d)){st++;d=add(d,-1)}
 const by={};S.sess.forEach(x=>{const k=x.s||'مذاكرة حرة';by[k]=(by[k]||0)+x.min});
 const cl=S.sess.length?Math.round(S.sess.filter(x=>x.clean).length/S.sess.length*100):0,att=S.sess.reduce((a,x)=>a+x.att,0);
 return `${wr()}<div class="c g"><div><big>${mins(T)}</big><small>دقيقة النهاردة</small></div><div><big style="color:var(--am)">🔥${st}</big><small>أيام متواصلة</small></div><div><big>${cl}%</big><small>جلسات من غير تشتت</small></div><div><big>${att}</big><small>محاولات تشتت</small></div></div>
 <div class="c"><b>آخر 7 أيام (بالدقايق)</b><div class="bars">${wk.map(w=>`<i style="height:${w[1]/mx*100}%"></i>`).join('')}</div><div class="bars2">${wk.map(w=>`<span>${w[1]}</span>`).join('')}</div></div>
 ${(()=>{const r={};S.sess.forEach(x=>{if(x.rz)r[x.rz]=(r[x.rz]||0)+1});const e=Object.entries(r).sort((a,b)=>b[1]-a[1]);return e.length?`<div class="c"><b>أكتر أسباب التشتت</b>${e.map(([k,v])=>`<div class="r"><div>${k}</div><span>${v}</span></div>`).join('')}</div>`:''})()}
 <div class="c"><b>حسب المادة</b>${Object.entries(by).map(([k,v])=>`<div class="r"><div>${esc(k)}</div><span>${v} د</span></div>`).join('')||'<p><small>ابدأ جلسة تركيز وهتظهر بياناتك هنا.</small></p>'}</div>`}

function render(){snap();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 $('v').innerHTML=({today:vToday,mat:vMat,plan:vPlan,mist:vMem,stats:()=>vStats()+'<details class="c"><summary><b>🌙 جدول النوم</b></summary>'+vSleep()+'</details><details class="c"><summary><b>💾 نسخة احتياطية</b></summary><small>انسخ بياناتك واحفظها. لو اتمسحت، الصقها هنا واضغط استرجاع.</small><textarea id="bkp" style="min-height:90px"></textarea><div class="row"><button onclick="bkx()">انسخ بياناتي</button><button onclick="bki()">استرجع من النص</button></div><small id="bkm"></small></details>',help:vHelp,wiz:vWiz})[tab]();
}
document.querySelector('nav').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;render()}};

function at(){const n=$('n').value.trim();if(!n)return;S.tasks.push({id:Date.now(),n,s:$('s').value.trim(),min:+$('m').value||30,date:$('dt').value||T,df:+$('df').value,done:false});save();render()}
function tg(id){const t=S.tasks.find(x=>x.id==id);t.done=!t.done;save();render()}
function dl(id){S.tasks=S.tasks.filter(x=>x.id!=id);save();render()}
function rs(){
 const od=S.tasks.filter(t=>!t.done&&t.date<T).sort((a,b)=>a.date.localeCompare(b.date)),load={};
 S.tasks.filter(t=>!t.done&&t.date>=T).forEach(t=>load[t.date]=(load[t.date]||0)+W(t));
 let d=T;
 od.forEach(t=>{t.bk=1;while((load[d]||0)>0&&(load[d]||0)+W(t)>S.cap)d=add(d,1);t.date=d;load[d]=(load[d]||0)+W(t)});
 save();render()}

function go(){if(run)return;fmsg='';try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}
 run={end:Date.now()+dur*1e3,tot:dur,att:0,tid:stid};startAud(dur,0);iv=setInterval(tick,500);render()}
function tick(){if(!run)return;const l=Math.ceil((run.end-Date.now())/1e3);if(l<=0){fin();return}const e=$('tm');if(e)e.textContent=fmt(l)}
function fin(){clearInterval(iv);if(run.brk){run=null;fmsg='⏰ الراحة خلصت. جاهز تبدأ جلسة تانية؟'+nxt();render();ring('s');return}
 const c=run.att==0;ring('b');recS(run.tot);run=null;
 fmsg=c?'⏰ خلصت الجلسة 🌳 من غير تشتت. جاهز للراحة؟ '+bkb():'⏰ خلصت الجلسة 🥀 بس خرجت من الصفحة. إيه السبب؟<div class="row" style="justify-content:center">'+['زهق','الدرس صعب','تعب','إشعارات'].map(x=>`<button class="ch" onclick="rz('${x}')">${x}</button>`).join('')+'</div>'+bkb();render()}
function recS(el){const t=S.tasks.find(x=>x.id==run.tid);if(el>=30){S.sess.push({d:T,min:Math.max(1,Math.round(el/60)),att:run.att,clean:run.att==0,s:t?t.s:''});save()}}
document.addEventListener('visibilitychange',()=>{
 if(!run)return;
 if(document.hidden){if(!run.brk&&!run.p)run.att++}
 else if(!run.brk){const m=$('fm');if(m)m.innerHTML='⚠️ خرجت من الصفحة '+run.att+' مرة. رجّع تركيزك!';tick()}});

function se(v){S.exam=v;save();render()}
function sg(v){S.goal=+v||120;save();render()}
function brk(sec){sec=sec||300;fmsg='';run={end:Date.now()+sec*1e3,tot:sec,att:0,brk:1};startAud(0,sec);iv=setInterval(tick,500);render()}
function rz(x){S.sess[S.sess.length-1].rz=x;save();fmsg='اتسجل: '+x+' 👍 '+bkb();render()}
let sub='cards',fcs=0;
const ORD=[6,0,1,2,3,4,5],NM=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const bt=(w,h)=>{const[a,b]=w.split(':').map(Number);const m=((a*60+b-Math.round(h*60)-15)%1440+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const t12=q=>{const[a,b]=q.split(':').map(Number);return (a%12||12)+':'+String(b).padStart(2,'0')+(a<12?' ص':' م')};
function vMem(){return `<div class="row">${[['cards','ملفات الحفظ'],['exam','امتحان']].map(([k,n])=>`<button class="ch ${sub==k?'on':''}" onclick="sub='${k}';render()">${n}</button>`).join('')}</div>`+({cards:vCards,exam:vExam})[sub]()}
let dk=0,Q=null,darm=0,led=0,ted=0;
const D=()=>S.dk.find(d=>d.id==dk),shf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function vCards(){
 if(Q)return vQuiz();
 const d=D();
 if(!d)return `<div class="c"><h2>ملفات الحفظ</h2>${S.dk.map(x=>`<div class="r"><div><b>${esc(x.n)}</b><small>${x.cards.length} بطاقة • ${x.cards.filter(c=>c.nx<=T).length} للمراجعة</small></div><button onclick="dk=${x.id};fcs=0;render()">افتح</button></div>`).join('')||'<p><small>لسه مفيش ملفات. اعمل أول ملف.</small></p>'}</div><div class="c"><b>➕ ملف جديد</b><input id="dn" placeholder="اسم الملف (مثلاً: قوانين الفيزياء)"><button class="pr" onclick="nd()">اعمل الملف</button></div>`;
 const due=d.cards.filter(c=>c.nx<=T),c=due[0];
 return `<button style="margin-bottom:10px" onclick="dk=0;render()">← كل الملفات</button><div class="c"><h2>${esc(d.n)}</h2><small>${d.cards.length} بطاقة • ${due.length} للمراجعة النهاردة</small>${c?`<div class="big2" style="text-align:center;font-size:22px">${esc(c.f)}</div>${fcs?`<div class="c" style="background:var(--bg)">${esc(c.b)}</div><div class="row"><button class="ok" onclick="rc(${c.id},1)">عرفتها ✓</button><button class="bad" onclick="rc(${c.id},0)">لسه ✗</button></div>`:'<button class="pr" onclick="fcs=1;render()">اكشف الإجابة</button>'}`:'<p><small>مفيش بطاقات للمراجعة النهاردة 👌</small></p>'}</div>
 <div class="c"><b>➕ بطاقة جديدة</b><textarea id="cf" placeholder="الوش: سؤال أو مصطلح أو قانون"></textarea><textarea id="cb" placeholder="الضهر: الإجابة"></textarea><button class="pr" onclick="ac()">احفظ البطاقة</button></div>
 ${d.cards.length?`<div class="c"><b>📝 اختبار على الملف</b><div class="row"><small>عدد الأسئلة:</small><input id="qn" type="number" min="1" max="${d.cards.length}" value="${Math.min(10,d.cards.length)}" style="width:80px;margin:0"><small>من ${d.cards.length}</small></div><div class="row"><button class="pr" style="flex:1" onclick="qs(0)">أقيّم نفسي</button>${d.cards.length>=4?'<button class="pr" style="flex:1" onclick="qs(1)">اختيارات</button>':''}</div></div><details class="c"><summary><b>كل البطاقات (${d.cards.length})</b></summary>${d.cards.map(x=>`<div class="r"><div>${esc(x.f)}<small>${esc(x.b)}</small></div><button class="x" onclick="dc(${x.id})">✕</button></div>`).join('')}</details>`:''}
 <button class="bad" style="width:100%" onclick="dd()">${darm?'متأكد؟ اضغط تاني':'🗑 احذف الملف'}</button>`}
function nd(){const n=$('dn').value.trim();if(!n)return;const d={id:uid(),n,cards:[]};S.dk.push(d);dk=d.id;save();render()}
function ac(){const f=$('cf').value.trim();if(!f)return;D().cards.push({id:uid(),f,b:$('cb').value.trim(),st:0,nx:T});save();render()}
function rc(id,ok){const c=D().cards.find(x=>x.id==id);c.st=ok?Math.min(c.st+1,4):0;c.nx=ok?add(T,[1,3,7,14,30][c.st]):add(T,1);fcs=0;save();render()}
function dc(id){const d=D();d.cards=d.cards.filter(x=>x.id!=id);save();render()}
function dd(){if(!darm){darm=1;render();setTimeout(()=>{if(darm){darm=0;render()}},4000);return}S.dk=S.dk.filter(x=>x.id!=dk);dk=0;darm=0;save();render()}
const nz=t=>String(t).replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim().toLowerCase();
const qc=()=>{const x=Q.it[Q.i],d=S.dk.find(y=>y.id==x.d);return[d,d.cards.find(c=>c.id==x.c),x]};
function qgo(it,pool){Q={it,pool,i:0,ok:0,bad:[],step:0};qo()}
function qs(mc){const d=D(),n=Math.max(1,Math.min(d.cards.length,+$('qn').value||1));qgo(shf(d.cards).slice(0,n).map(c=>({d:d.id,c:c.id,t:mc?'mc':'s'})),d.cards.map(c=>c.b).filter(Boolean))}
